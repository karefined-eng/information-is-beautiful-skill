<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="470" fill="#ffffff"/>

  <!-- panel headers -->
  <text x="16" y="22" font-size="12" fill="#a5a5a5" font-weight="bold">&#10007; default software</text>
  <text x="616" y="22" font-size="12" fill="#ff5d1f" font-weight="bold">&#10003; with information-is-beautiful</text>
  <line x1="599" y1="8" x2="599" y2="462" stroke="#dddddd" stroke-width="1"/>

  <!-- ==================== BEFORE: default-software slop ==================== -->
  <rect x="10" y="30" width="580" height="430" fill="#ffffff" stroke="#bfbfbf"/>
  <text x="300" y="55" text-anchor="middle" font-size="15" font-weight="bold" fill="#404040">Q4 Support Ticket Report - Final (2)</text>

  <!-- gridline wallpaper every 25 units -->
  <g stroke="#d9d9d9" stroke-width="1">
    <line x1="90" y1="359.2" x2="470" y2="359.2"/>
    <line x1="90" y1="328.5" x2="470" y2="328.5"/>
    <line x1="90" y1="297.7" x2="470" y2="297.7"/>
    <line x1="90" y1="266.9" x2="470" y2="266.9"/>
    <line x1="90" y1="236.2" x2="470" y2="236.2"/>
    <line x1="90" y1="205.4" x2="470" y2="205.4"/>
  </g>

  <!-- truncated y axis: baseline = 100, ticks 125..250 -->
  <g font-size="8" fill="#808080" text-anchor="end">
    <text x="85" y="393">100</text>
    <text x="85" y="362">125</text>
    <text x="85" y="331">150</text>
    <text x="85" y="301">175</text>
    <text x="85" y="270">200</text>
    <text x="85" y="239">225</text>
    <text x="85" y="208">250</text>
  </g>
  <text x="55" y="230" font-size="10" fill="#808080" transform="rotate(-90 55 230)">Tickets</text>
  <!-- axis break marks on the y axis -->
  <path d="M86 386 l8 -5 M86 392 l8 -5" stroke="#808080" stroke-width="1" fill="none"/>

  <!-- bars: 4 quarters x 4 regions, Office palette, truncated scale (values below 100 hang below) -->
  <!-- EMEA #4472C4 / AMER #ED7D31 / APAC #A5A5A5 / LATAM #FFC000 -->
  <g stroke="#a6a6a6" stroke-width="0.5">
    <!-- Q1 cluster -->
    <rect x="92"  y="365.4" width="16" height="24.6" fill="#4472C4"/>
    <rect x="112" y="289.1" width="16" height="100.9" fill="#ED7D31"/>
    <rect x="132" y="390" width="16" height="14.8" fill="#A5A5A5"/>
    <rect x="152" y="390" width="16" height="68.8" fill="#FFC000"/>
    <!-- Q2 cluster -->
    <rect x="202" y="359.2" width="16" height="30.8" fill="#4472C4"/>
    <rect x="222" y="294.1" width="16" height="95.9" fill="#ED7D31"/>
    <rect x="242" y="390" width="16" height="9.8" fill="#A5A5A5"/>
    <rect x="262" y="390" width="16" height="66.5" fill="#FFC000"/>
    <!-- Q3 cluster -->
    <rect x="312" y="207.7" width="16" height="182.3" fill="#4472C4"/>
    <rect x="332" y="290.4" width="16" height="99.6" fill="#ED7D31"/>
    <rect x="352" y="390" width="16" height="12.3" fill="#A5A5A5"/>
    <rect x="372" y="390" width="16" height="67.7" fill="#FFC000"/>
    <!-- Q4 cluster -->
    <rect x="422" y="202.9" width="16" height="187.1" fill="#4472C4"/>
    <rect x="442" y="292.8" width="16" height="97.2" fill="#ED7D31"/>
    <rect x="462" y="390" width="8" height="8.6" fill="#A5A5A5"/>
    <rect x="470" y="390" width="8" height="65.2" fill="#FFC000"/>
  </g>

  <!-- axis + clipped-baseline signal -->
  <line x1="90" y1="70" x2="90" y2="390" stroke="#808080"/>
  <line x1="90" y1="390" x2="480" y2="390" stroke="#808080"/>
  <g font-size="10" fill="#808080" text-anchor="middle">
    <text x="130" y="404">Q1</text>
    <text x="240" y="404">Q2</text>
    <text x="350" y="404">Q3</text>
    <text x="450" y="404">Q4</text>
  </g>

  <!-- legend -->
  <rect x="486" y="80" width="96" height="74" fill="#ffffff" stroke="#bfbfbf"/>
  <g font-size="9" fill="#404040">
    <rect x="492" y="86"  width="10" height="10" fill="#4472C4"/><text x="507" y="95">EMEA</text>
    <rect x="492" y="104" width="10" height="10" fill="#ED7D31"/><text x="507" y="113">AMER</text>
    <rect x="492" y="122" width="10" height="10" fill="#A5A5A5"/><text x="507" y="131">APAC</text>
    <rect x="492" y="140" width="10" height="10" fill="#FFC000"/><text x="507" y="149">LATAM</text>
  </g>
  <text x="300" y="440" text-anchor="middle" font-size="9" fill="#a5a5a5" font-style="italic">axis starts at 100 &#8212; APAC and LATAM fell off the chart entirely</text>

  <!-- ==================== AFTER: by the five laws ==================== -->
  <text x="680" y="52" font-size="17" font-weight="bold" fill="#17140e" font-family="Georgia, 'Times New Roman', serif">EMEA ticket volume doubled in Q3 &#8212;</text>
  <text x="680" y="72" font-size="17" font-weight="bold" fill="#17140e" font-family="Georgia, 'Times New Roman', serif">every other region held flat</text>

  <!-- quiet gridlines at 50-unit steps -->
  <g stroke="#17140e" stroke-opacity="0.1" stroke-width="1">
    <line x1="680" y1="328.5" x2="1120" y2="328.5"/>
    <line x1="680" y1="266.9" x2="1120" y2="266.9"/>
    <line x1="680" y1="205.4" x2="1120" y2="205.4"/>
    <line x1="680" y1="143.8" x2="1120" y2="143.8"/>
    <line x1="680" y1="82.3"  x2="1120" y2="82.3"/>
  </g>
  <g font-size="10" fill="#4a463c" font-family="'Courier New', monospace" text-anchor="end">
    <text x="672" y="393">0</text>
    <text x="672" y="332">50</text>
    <text x="672" y="270">100</text>
    <text x="672" y="209">150</text>
    <text x="672" y="147">200</text>
    <text x="672" y="85">250</text>
  </g>

  <!-- context series: soft ink, thin -->
  <g stroke="#4a463c" stroke-width="1.5" fill="none">
    <polyline points="745,166.0 855,170.9 965,167.2 1075,169.7"/>
    <polyline points="745,281.7 855,276.8 965,279.2 1075,275.5"/>
    <polyline points="745,335.8 855,333.4 965,334.6 1075,332.2"/>
  </g>

  <!-- the finding: one accent series with points -->
  <polyline points="745,242.3 855,236.2 965,84.8 1075,79.8" stroke="#ff5d1f" stroke-width="2.5" fill="none"/>
  <g fill="#ff5d1f">
    <circle cx="745" cy="242.3" r="3"/><circle cx="855" cy="236.2" r="3"/>
    <circle cx="965" cy="84.8" r="3"/><circle cx="1075" cy="79.8" r="3"/>
  </g>

  <!-- direct labels at line ends -->
  <g font-size="11" font-family="'Courier New', monospace">
    <text x="1084" y="83"  fill="#ff5d1f" font-weight="bold">EMEA 252</text>
    <text x="1084" y="173" fill="#4a463c">AMER 179</text>
    <text x="1084" y="279" fill="#4a463c">APAC 93</text>
    <text x="1084" y="336" fill="#4a463c">LATAM 47</text>
  </g>

  <!-- axes + x labels -->
  <line x1="680" y1="80" x2="680" y2="390" stroke="#17140e" stroke-width="1"/>
  <line x1="680" y1="390" x2="1120" y2="390" stroke="#17140e" stroke-width="1"/>
  <g font-size="11" fill="#4a463c" font-family="'Courier New', monospace" text-anchor="middle">
    <text x="745" y="406">Q1</text>
    <text x="855" y="406">Q2</text>
    <text x="965" y="406">Q3</text>
    <text x="1075" y="406">Q4</text>
  </g>
  <text x="1120" y="424" text-anchor="end" font-size="9" fill="#4a463c" font-family="'Courier New', monospace">Source: internal ticketing export, Q1&#8211;Q4</text>
</svg>
