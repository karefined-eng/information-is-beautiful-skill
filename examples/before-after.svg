<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Arial, Helvetica, sans-serif">
  <!-- Data (real, sourced): Ghana CPI year-on-year, Ghana Statistical Service —
       Dec 2022: 54.1% | Dec 2023: 23.2% | Dec 2024: 23.8% | Dec 2025: 5.4% | Sep 2026: 5.2%
       (Sep 2026 via Reuters, Oct 7 2026). Same series drawn twice below. -->
  <rect width="1200" height="470" fill="#ffffff"/>

  <!-- panel headers -->
  <text x="16" y="22" font-size="12" fill="#a5a5a5" font-weight="bold">&#10007; default software</text>
  <text x="616" y="22" font-size="12" fill="#ff5d1f" font-weight="bold">&#10003; with information-is-beautiful</text>
  <line x1="599" y1="8" x2="599" y2="462" stroke="#dddddd" stroke-width="1"/>

  <!-- ==================== BEFORE: 3D pie of a time series ==================== -->
  <rect x="10" y="30" width="580" height="430" fill="#ffffff" stroke="#bfbfbf"/>
  <text x="300" y="55" text-anchor="middle" font-size="15" font-weight="bold" fill="#404040">Ghana Inflation Breakdown</text>

  <!-- 3D pie wall -->
  <path d="M 160 225 A 140 90 0 0 0 440 225 L 440 250 A 140 90 0 0 1 160 250 Z" fill="#808080"/>

  <!-- slices: rates treated as parts of a whole (they are not) -->
  <path d="M 314.98 224.27 L 314.98 134.27 A 140 90 0 0 1 328.64 313.84 Z" fill="#4472C4"/>
  <path d="M 300 225 L 313.7 314.6 A 140 90 0 0 1 169.3 257.3 Z" fill="#ED7D31"/>
  <path d="M 300 225 L 169.3 257.3 A 140 90 0 0 1 221.3 150.6 Z" fill="#A5A5A5"/>
  <path d="M 300 225 L 221.3 150.6 A 140 90 0 0 1 259.5 138.8 Z" fill="#FFC000"/>
  <path d="M 300 225 L 259.5 138.8 A 140 90 0 0 1 300 135 Z" fill="#5B9BD5"/>

  <!-- legend -->
  <rect x="486" y="90" width="100" height="96" fill="#ffffff" stroke="#bfbfbf"/>
  <g font-size="9" fill="#404040">
    <rect x="492" y="96"  width="10" height="10" fill="#4472C4"/><text x="507" y="105">Dec '22</text>
    <rect x="492" y="114" width="10" height="10" fill="#ED7D31"/><text x="507" y="123">Dec '23</text>
    <rect x="492" y="132" width="10" height="10" fill="#A5A5A5"/><text x="507" y="141">Dec '24</text>
    <rect x="492" y="150" width="10" height="10" fill="#FFC000"/><text x="507" y="159">Dec '25</text>
    <rect x="492" y="168" width="10" height="10" fill="#5B9BD5"/><text x="507" y="177">Sep '26</text>
  </g>
  <text x="300" y="440" text-anchor="middle" font-size="9" fill="#a5a5a5" font-style="italic">a pie of rates over time &#8212; shares of a whole that never existed, trend invisible</text>

  <!-- ==================== AFTER: honest time line ==================== -->
  <text x="680" y="52" font-size="17" font-weight="bold" fill="#17140e" font-family="Georgia, 'Times New Roman', serif">Ghana cut inflation from 54% to 5% in three years</text>
  <text x="680" y="72" font-size="13" fill="#4a463c" font-family="Georgia, 'Times New Roman', serif">and it is holding near 5% despite a slight uptick since July</text>

  <!-- quiet gridlines -->
  <g stroke="#17140e" stroke-opacity="0.1" stroke-width="1">
    <line x1="680" y1="336.7" x2="1120" y2="336.7"/>
    <line x1="680" y1="283.3" x2="1120" y2="283.3"/>
    <line x1="680" y1="230"   x2="1120" y2="230"/>
    <line x1="680" y1="176.7" x2="1120" y2="176.7"/>
    <line x1="680" y1="123.3" x2="1120" y2="123.3"/>
  </g>
  <g font-size="10" fill="#4a463c" font-family="'Courier New', monospace" text-anchor="end">
    <text x="672" y="393">0</text>
    <text x="672" y="340">10</text>
    <text x="672" y="287">20</text>
    <text x="672" y="233">30</text>
    <text x="672" y="180">40</text>
    <text x="672" y="127">50</text>
    <text x="672" y="74">60</text>
  </g>

  <!-- the series, time-proportional -->
  <polyline points="680,101.5 792,266.3 904,263.1 1016,361.2 1100,362.3" stroke="#ff5d1f" stroke-width="2.5" fill="none"/>
  <g fill="#ff5d1f">
    <circle cx="680" cy="101.5" r="3"/><circle cx="792" cy="266.3" r="3"/>
    <circle cx="904" cy="263.1" r="3"/><circle cx="1016" cy="361.2" r="3"/>
    <circle cx="1100" cy="362.3" r="3"/>
  </g>

  <!-- direct labels: the value at every point -->
  <g font-size="11" font-family="'Courier New', monospace" fill="#17140e">
    <text x="680" y="90" text-anchor="start">54.1%</text>
    <text x="792" y="254" text-anchor="middle">23.2%</text>
    <text x="904" y="251" text-anchor="middle">23.8%</text>
    <text x="1016" y="384" text-anchor="middle">5.4%</text>
    <text x="1100" y="384" text-anchor="end">5.2%</text>
  </g>

  <!-- axes + x labels -->
  <line x1="680" y1="80" x2="680" y2="390" stroke="#17140e" stroke-width="1"/>
  <line x1="680" y1="390" x2="1120" y2="390" stroke="#17140e" stroke-width="1"/>
  <g font-size="10" fill="#4a463c" font-family="'Courier New', monospace" text-anchor="middle">
    <text x="680" y="406">Dec '22</text>
    <text x="792" y="406">Dec '23</text>
    <text x="904" y="406">Dec '24</text>
    <text x="1016" y="406">Dec '25</text>
    <text x="1100" y="406">Sep '26</text>
  </g>
  <text x="1120" y="424" text-anchor="end" font-size="9" fill="#4a463c" font-family="'Courier New', monospace">Source: Ghana Statistical Service CPI, y/y &#183; Sep 2026 via Reuters (Oct 7, 2026)</text>
</svg>
